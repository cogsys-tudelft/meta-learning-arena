model:
  class_path: autolightning.lm.brevitas.BrevitasPrototypical

  init_args:
    # weight_quant is not specified here the quantization configs are
    # specified under configs/quant/weight

    act_quant:
      class_path: autolightning.lm.brevitas.quantizer
      init_args:
        class_paths: ["ShiftedUint8ActPerTensorFixedPoint"]
        init_args:
          bit_width: 4
          collect_stats_steps: 1500
          float_to_int_impl_type:
            class_path: brevitas.inject.enum.FloatToIntImplType
            init_args:
              value: "FLOOR"
    in_quant:
      class_path: autolightning.lm.brevitas.quantizer
      init_args:
        class_paths: ["ShiftedUint8ActPerTensorFixedPoint"]
        init_args:
          bit_width: 4
          collect_stats_steps: 1500
    bias_quant:
      class_path: autolightning.lm.brevitas.quantizer
      init_args:
        class_paths: ["Int16Bias"]
        init_args:
          bit_width: 14
          collect_stats_steps: 1500
          narrow_range: false
    load_float_weights_into_model: true
    fold_batch_norm_layers: true
    enable_brevitas_jit: true
    remove_dropout_layers: true
    allow_quant_tensor_slicing: true
    skip_modules:
      - tcn_lib.blocks.Chomp1d
      - tcn_lib.blocks.LastElement1d
      - tcn_lib.blocks.PointwiseLayer
      - tcn_lib.blocks.TemporalBlock
      - tcn_lib.blocks.TemporalBottleneck
      - tcn_lib.blocks.TemporalConvNet
      - tcn_lib.blocks.TemporalLayer
      - torch.nn.Dropout
    calibrate: true
    correct_norms: true
    correct_biases: true
    limit_calibration_batches: 100

    metric: euclidean-squared

    net:
      class_path: autolightning.load
      init_args:
        file_path: /space/ddenblanken/Projects/meta-learning-arena-new/test_wandb_lightning/vg3yq0yt/checkpoints/epoch=0-step=60000.ckpt
        state_dict_submodule: net._orig_mod
        module:
          class_path: tcn_lib.TCN
          init_args:
            input_size: 1
            channel_sizes: [32, 32, 32, 48, 48, 48, 48]
            output_size: -1
            kernel_size: 5
            dropout: 0.025
            batch_norm: true
            residual: true
            weight_norm: false
            zero_init_residual: false
optimizer:
  class_path: torch.optim.Adam
  init_args:
    lr: 0.0007
    weight_decay: 0.0007
lr_scheduler:
  class_path: torch.optim.lr_scheduler.StepLR
  init_args:
    step_size: 1000
    gamma: 0.08
seed_everything: 4223747124
trainer:
  max_steps: 4000
  val_check_interval: 300
  limit_val_batches: 50
